<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Tracker — Colorado Succeeds</title>
  <style>
    /* ── Colorado Succeeds Brand Tokens ── */
    :root {
      --cs-navy:      #1B3A6B;
      --cs-navy-dk:   #122954;
      --cs-navy-lt:   #2A5298;
      --cs-orange:    #F7941D;
      --cs-orange-dk: #D97B0A;
      --cs-orange-lt: #FBB24B;
      --cs-slate:     #5A6A7A;
      --cs-mist:      #EDF2F7;
      --cs-white:     #FFFFFF;
      --cs-border:    #D1DCE8;
      --cs-text:      #1A2533;
      --cs-text-sm:   #4A5568;

      /* Status colors */
      --overdue-3:    #C53030;   /* 90+ days */
      --overdue-2:    #DD6B20;   /* 30–89 days */
      --overdue-1:    #D69E2E;   /* 14–29 days */
      --ok:           #276749;   /* < 14 days */

      --radius:       8px;
      --shadow:       0 2px 8px rgba(27,58,107,.10);
      --shadow-md:    0 4px 20px rgba(27,58,107,.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--cs-mist);
      color: var(--cs-text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--cs-navy);
      color: var(--cs-white);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 64px;
      box-shadow: 0 2px 10px rgba(0,0,0,.20);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--cs-orange);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: var(--cs-white);
      flex-shrink: 0;
      letter-spacing: -1px;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .header-title span:first-child {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .header-title span:last-child {
      font-size: 11px;
      color: rgba(255,255,255,.65);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s, box-shadow .15s;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: var(--cs-orange);
      color: var(--cs-white);
    }

    .btn-primary:hover { background: var(--cs-orange-dk); box-shadow: 0 2px 8px rgba(247,148,29,.35); }

    .btn-ghost {
      background: rgba(255,255,255,.12);
      color: var(--cs-white);
      border: 1px solid rgba(255,255,255,.25);
    }

    .btn-ghost:hover { background: rgba(255,255,255,.20); }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-danger { background: #FEE2E2; color: #991B1B; }
    .btn-danger:hover { background: #FCA5A5; }

    .btn-edit { background: var(--cs-mist); color: var(--cs-navy); border: 1px solid var(--cs-border); }
    .btn-edit:hover { background: #dce8f5; }

    /* ── Main layout ── */
    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 24px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cs-slate);
      pointer-events: none;
      font-size: 15px;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--cs-border);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--cs-white);
      color: var(--cs-text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .search-input:focus {
      border-color: var(--cs-navy-lt);
      box-shadow: 0 0 0 3px rgba(42,82,152,.15);
    }

    .count-badge {
      font-size: 13px;
      color: var(--cs-text-sm);
      white-space: nowrap;
    }

    .count-badge strong { color: var(--cs-navy); }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--cs-white);
      border: 1px solid var(--cs-border);
      border-radius: var(--radius);
      padding: 14px 20px;
      flex: 1;
      min-width: 120px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--cs-slate);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--cs-navy);
      line-height: 1;
    }

    .stat-card.urgent .stat-value { color: var(--overdue-3); }

    /* ── Contact cards ── */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-card {
      background: var(--cs-white);
      border: 1px solid var(--cs-border);
      border-left: 4px solid var(--cs-border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      transition: box-shadow .15s, transform .1s;
      cursor: default;
    }

    .contact-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    /* Urgency border colors */
    .contact-card.urgency-3 { border-left-color: var(--overdue-3); }
    .contact-card.urgency-2 { border-left-color: var(--overdue-2); }
    .contact-card.urgency-1 { border-left-color: var(--overdue-1); }
    .contact-card.urgency-0 { border-left-color: var(--ok); }
    .contact-card.urgency-none { border-left-color: var(--cs-slate); }

    /* Rank badge */
    .rank-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--cs-mist);
      border: 1px solid var(--cs-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--cs-slate);
      flex-shrink: 0;
    }

    .contact-card.urgency-3 .rank-badge { background: #FEE2E2; border-color: #FCA5A5; color: var(--overdue-3); }
    .contact-card.urgency-2 .rank-badge { background: #FEF3C7; border-color: #FCD34D; color: var(--overdue-2); }

    /* Card body */
    .card-body { min-width: 0; }

    .card-top {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .contact-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--cs-navy);
    }

    .contact-org {
      font-size: 13px;
      color: var(--cs-text-sm);
      background: var(--cs-mist);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--cs-border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--cs-text-sm);
    }

    .meta-item .icon { font-size: 13px; }

    .days-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .days-badge.urgency-3 { background: #FEE2E2; color: var(--overdue-3); }
    .days-badge.urgency-2 { background: #FEF3C7; color: var(--overdue-2); }
    .days-badge.urgency-1 { background: #FEFCE8; color: var(--overdue-1); }
    .days-badge.urgency-0 { background: #D1FAE5; color: var(--ok); }
    .days-badge.urgency-none { background: var(--cs-mist); color: var(--cs-slate); }

    .next-step {
      font-size: 13px;
      color: var(--cs-text);
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .next-step .label {
      font-weight: 600;
      color: var(--cs-navy-lt);
      margin-right: 4px;
    }

    .contact-notes {
      font-size: 12px;
      color: var(--cs-text-sm);
      margin-top: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Card actions */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--cs-text-sm);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: .6;
    }

    .empty-state h3 {
      font-size: 18px;
      color: var(--cs-navy);
      margin-bottom: 8px;
    }

    .empty-state p { font-size: 14px; margin-bottom: 20px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18,41,84,.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--cs-white);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px) scale(.97);
      transition: transform .2s;
    }

    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-header {
      padding: 20px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 18px;
      color: var(--cs-navy);
      font-weight: 700;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--cs-mist);
      color: var(--cs-slate);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background .15s;
    }

    .modal-close:hover { background: #dce8f5; color: var(--cs-navy); }

    .modal-body { padding: 20px 24px 24px; }

    /* ── Form ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--cs-navy);
    }

    label .required { color: var(--cs-orange); margin-left: 2px; }

    input[type="text"],
    input[type="date"],
    textarea,
    select {
      padding: 9px 12px;
      border: 1px solid var(--cs-border);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--cs-text);
      background: var(--cs-white);
      outline: none;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--cs-navy-lt);
      box-shadow: 0 0 0 3px rgba(42,82,152,.15);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel {
      background: var(--cs-mist);
      color: var(--cs-slate);
      border: 1px solid var(--cs-border);
    }

    .btn-cancel:hover { background: #dce8f5; }

    /* ── Detail expand ── */
    .card-detail {
      grid-column: 1 / -1;
      border-top: 1px dashed var(--cs-border);
      margin-top: 8px;
      padding-top: 10px;
      font-size: 13px;
      color: var(--cs-text-sm);
      display: none;
    }

    .card-detail.open { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 24px;
    }

    .detail-item strong {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--cs-navy);
      margin-bottom: 2px;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header { padding: 0 16px; }
      main { margin: 16px auto; padding: 0 12px; }
      .form-grid { grid-template-columns: 1fr; }
      .contact-card { grid-template-columns: 1fr auto; }
      .rank-badge { display: none; }
      .card-actions { flex-direction: row; }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--cs-border); border-radius: 3px; }

    /* ── Focus-visible ── */
    :focus-visible { outline: 2px solid var(--cs-orange); outline-offset: 2px; }

    /* Tooltip */
    [data-tip] { position: relative; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--cs-navy);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
    }
    [data-tip]:hover::after { opacity: 1; }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="header-brand">
    <div class="logo-mark">CS</div>
    <div class="header-title">
      <span>Partner Tracker</span>
      <span>Colorado Succeeds</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="exportBtn">&#8595; Export CSV</button>
    <button class="btn btn-primary" id="addBtn">+ Add Contact</button>
  </div>
</header>

<!-- ── MAIN ── -->
<main>

  <!-- Stats bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <div class="stat-label">Total Contacts</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat-card urgent">
      <div class="stat-label">Overdue 90+ days</div>
      <div class="stat-value" id="statCritical">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Overdue 30–89 days</div>
      <div class="stat-value" id="statWarning">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Contacted this month</div>
      <div class="stat-value" id="statRecent">0</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search by name, org, or next step…" />
    </div>
    <span class="count-badge" id="countBadge"></span>
  </div>

  <!-- Contact list -->
  <div class="contact-list" id="contactList"></div>

</main>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add Contact</h2>
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <form id="contactForm" novalidate>
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div class="form-group">
            <label for="fname">Name <span class="required">*</span></label>
            <input type="text" id="fname" placeholder="Full name" required />
          </div>
          <div class="form-group">
            <label for="forg">Organization <span class="required">*</span></label>
            <input type="text" id="forg" placeholder="Org / nonprofit name" required />
          </div>
          <div class="form-group full">
            <label for="flastDate">Last Outreach Date</label>
            <input type="date" id="flastDate" />
          </div>
          <div class="form-group full">
            <label for="fnextstep">Next Step / Follow-up Needed</label>
            <input type="text" id="fnextstep" placeholder="e.g. Send partnership proposal, schedule Q2 check-in…" />
          </div>
          <div class="form-group full">
            <label for="fnotes">Notes</label>
            <textarea id="fnotes" placeholder="Context, meeting notes, priorities, relationship history…"></textarea>
          </div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn-cancel" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Contact</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // ── Storage helpers ──────────────────────────────────────────
  const STORE_KEY = 'cs_partners_v1';

  function loadContacts() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  }

  function saveContacts(contacts) {
    localStorage.setItem(STORE_KEY, JSON.stringify(contacts));
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ── State ────────────────────────────────────────────────────
  let contacts = loadContacts();
  let searchQ = '';
  let expandedId = null;

  // ── Date helpers ─────────────────────────────────────────────
  function today() {
    return new Date().toISOString().split('T')[0];
  }

  function daysSince(dateStr) {
    if (!dateStr) return null;
    const diff = Date.now() - new Date(dateStr).getTime();
    return Math.floor(diff / 86400000);
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const [y, m, d] = dateStr.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[+m - 1]} ${+d}, ${y}`;
  }

  function urgencyLevel(days) {
    if (days === null) return 'none';
    if (days >= 90) return '3';
    if (days >= 30) return '2';
    if (days >= 14) return '1';
    return '0';
  }

  function daysLabel(days) {
    if (days === null) return 'No outreach recorded';
    if (days === 0) return 'Today';
    if (days === 1) return '1 day ago';
    return `${days} days ago`;
  }

  // ── Sort: no-date first, then descending days ────────────────
  function sortContacts(list) {
    return [...list].sort((a, b) => {
      const da = daysSince(a.lastDate);
      const db = daysSince(b.lastDate);
      if (da === null && db === null) return a.name.localeCompare(b.name);
      if (da === null) return -1;
      if (db === null) return 1;
      return db - da;
    });
  }

  // ── Filter ───────────────────────────────────────────────────
  function filterContacts(list) {
    if (!searchQ.trim()) return list;
    const q = searchQ.toLowerCase();
    return list.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.org.toLowerCase().includes(q) ||
      (c.nextStep || '').toLowerCase().includes(q) ||
      (c.notes || '').toLowerCase().includes(q)
    );
  }

  // ── Render stats ─────────────────────────────────────────────
  function renderStats() {
    const all = contacts;
    document.getElementById('statTotal').textContent = all.length;

    let critical = 0, warning = 0, recent = 0;
    const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

    all.forEach(c => {
      const d = daysSince(c.lastDate);
      if (d === null) { critical++; return; }
      if (d >= 90) critical++;
      else if (d >= 30) warning++;
      if (d <= 30) recent++;
    });

    document.getElementById('statCritical').textContent = critical;
    document.getElementById('statWarning').textContent = warning;
    document.getElementById('statRecent').textContent = recent;
  }

  // ── Render list ──────────────────────────────────────────────
  function render() {
    renderStats();

    const sorted = sortContacts(contacts);
    const filtered = filterContacts(sorted);

    const listEl = document.getElementById('contactList');
    const badge = document.getElementById('countBadge');

    badge.innerHTML = filtered.length === contacts.length
      ? `<strong>${contacts.length}</strong> partner${contacts.length !== 1 ? 's' : ''}`
      : `Showing <strong>${filtered.length}</strong> of ${contacts.length}`;

    if (contacts.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">&#128101;</div>
          <h3>No contacts yet</h3>
          <p>Start building your partner network by adding your first contact.</p>
          <button class="btn btn-primary" onclick="openModal()">+ Add First Contact</button>
        </div>`;
      return;
    }

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">&#128269;</div>
          <h3>No matches found</h3>
          <p>Try adjusting your search.</p>
        </div>`;
      return;
    }

    listEl.innerHTML = filtered.map((c, idx) => {
      const days = daysSince(c.lastDate);
      const lvl = urgencyLevel(days);
      const label = daysLabel(days);
      const isExpanded = c.id === expandedId;

      return `
        <div class="contact-card urgency-${lvl}" data-id="${c.id}">
          <div class="rank-badge">${idx + 1}</div>

          <div class="card-body">
            <div class="card-top">
              <span class="contact-name">${esc(c.name)}</span>
              <span class="contact-org" title="${esc(c.org)}">${esc(c.org)}</span>
            </div>
            <div class="card-meta">
              <span class="days-badge urgency-${lvl}" data-tip="Last outreach: ${formatDate(c.lastDate)}">${esc(label)}</span>
              ${c.lastDate ? `<span class="meta-item"><span class="icon">&#128197;</span>${formatDate(c.lastDate)}</span>` : ''}
            </div>
            ${c.nextStep ? `<div class="next-step"><span class="label">&#9654; Next:</span>${esc(c.nextStep)}</div>` : ''}
            ${c.notes ? `<div class="contact-notes">&#128221; ${esc(c.notes)}</div>` : ''}

            ${isExpanded ? `
            <div class="card-detail open">
              <div class="detail-grid">
                <div class="detail-item"><strong>Next Step / Follow-up</strong>${c.nextStep ? esc(c.nextStep) : '<em>None recorded</em>'}</div>
                <div class="detail-item"><strong>Last Outreach</strong>${formatDate(c.lastDate)}</div>
                <div class="detail-item" style="grid-column:1/-1"><strong>Notes</strong>${c.notes ? esc(c.notes).replace(/\n/g,'<br>') : '<em>No notes</em>'}</div>
              </div>
            </div>` : ''}
          </div>

          <div class="card-actions">
            <button class="btn btn-sm btn-edit" onclick="openModal('${c.id}')">Edit</button>
            <button class="btn btn-sm btn-primary" onclick="markToday('${c.id}')" data-tip="Mark contacted today" style="background:var(--cs-navy);">&#10003; Today</button>
            <button class="btn btn-sm btn-danger" onclick="deleteContact('${c.id}')">Delete</button>
          </div>
        </div>`;
    }).join('');

    // Click to expand
    listEl.querySelectorAll('.contact-card').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.closest('button')) return;
        const id = card.dataset.id;
        expandedId = expandedId === id ? null : id;
        render();
      });
    });
  }

  // ── Escape HTML ──────────────────────────────────────────────
  function esc(str) {
    return String(str || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  // ── Mark contacted today ─────────────────────────────────────
  function markToday(id) {
    const c = contacts.find(x => x.id === id);
    if (!c) return;
    c.lastDate = today();
    saveContacts(contacts);
    render();
  }

  // ── Delete ───────────────────────────────────────────────────
  function deleteContact(id) {
    const c = contacts.find(x => x.id === id);
    if (!c) return;
    if (!confirm(`Remove "${c.name}" from your tracker?`)) return;
    contacts = contacts.filter(x => x.id !== id);
    if (expandedId === id) expandedId = null;
    saveContacts(contacts);
    render();
  }

  // ── Modal ────────────────────────────────────────────────────
  function openModal(id) {
    const overlay = document.getElementById('modalOverlay');
    const form = document.getElementById('contactForm');

    form.reset();
    document.getElementById('editId').value = '';
    document.getElementById('modalTitle').textContent = 'Add Contact';
    document.getElementById('saveBtn').textContent = 'Save Contact';

    if (id) {
      const c = contacts.find(x => x.id === id);
      if (!c) return;
      document.getElementById('modalTitle').textContent = 'Edit Contact';
      document.getElementById('saveBtn').textContent = 'Update Contact';
      document.getElementById('editId').value = c.id;
      document.getElementById('fname').value = c.name;
      document.getElementById('forg').value = c.org;
      document.getElementById('flastDate').value = c.lastDate || '';
      document.getElementById('fnextstep').value = c.nextStep || '';
      document.getElementById('fnotes').value = c.notes || '';
    }

    overlay.classList.add('open');
    setTimeout(() => document.getElementById('fname').focus(), 100);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  // ── Form submit ──────────────────────────────────────────────
  document.getElementById('contactForm').addEventListener('submit', e => {
    e.preventDefault();

    const name = document.getElementById('fname').value.trim();
    const org  = document.getElementById('forg').value.trim();

    if (!name || !org) {
      alert('Name and Organization are required.');
      return;
    }

    const id = document.getElementById('editId').value;
    const data = {
      name,
      org,
      lastDate:  document.getElementById('flastDate').value || null,
      nextStep:  document.getElementById('fnextstep').value.trim(),
      notes:     document.getElementById('fnotes').value.trim(),
    };

    if (id) {
      const idx = contacts.findIndex(x => x.id === id);
      if (idx !== -1) contacts[idx] = { ...contacts[idx], ...data };
    } else {
      contacts.push({ id: genId(), ...data });
    }

    saveContacts(contacts);
    closeModal();
    render();
  });

  // ── Export CSV ───────────────────────────────────────────────
  document.getElementById('exportBtn').addEventListener('click', () => {
    const rows = [['Name','Organization','Last Outreach','Days Since','Next Step','Notes']];
    sortContacts(contacts).forEach(c => {
      const days = daysSince(c.lastDate);
      rows.push([
        c.name, c.org,
        c.lastDate || '',
        days !== null ? days : 'N/A',
        c.nextStep || '',
        (c.notes || '').replace(/\n/g,' ')
      ]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `partner-tracker-${today()}.csv`;
    a.click();
  });

  // ── Wire up UI ───────────────────────────────────────────────
  document.getElementById('addBtn').addEventListener('click', () => openModal());
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    searchQ = e.target.value;
    render();
  });

  // ── Seed data (first load only) ──────────────────────────────
  if (contacts.length === 0) {
    const seeds = [
      {
        id: genId(),
        name: 'Maria Gonzalez',
        org: 'Denver Urban League',
        lastDate: (() => { const d = new Date(); d.setDate(d.getDate()-112); return d.toISOString().split('T')[0]; })(),
        nextStep: 'Schedule Q2 strategy meeting and share annual report',
        notes: 'Strong champion for workforce equity initiatives. Prefers morning calls.'
      },
      {
        id: genId(),
        name: 'James Okafor',
        org: 'Padres & Jóvenes Unidos',
        lastDate: (() => { const d = new Date(); d.setDate(d.getDate()-47); return d.toISOString().split('T')[0]; })(),
        nextStep: 'Follow up on MOU draft — sent 3/18',
        notes: 'Interested in co-hosting a parent engagement summit this fall.'
      },
      {
        id: genId(),
        name: 'Sarah Chen',
        org: 'Gary Community Ventures',
        lastDate: (() => { const d = new Date(); d.setDate(d.getDate()-8); return d.toISOString().split('T')[0]; })(),
        nextStep: 'Send speaker bio for May convening',
        notes: 'Met at Education Policy Forum. Very engaged with postsecondary access work.'
      },
      {
        id: genId(),
        name: 'Tom Whitfield',
        org: 'Daniels Fund',
        lastDate: null,
        nextStep: 'Reach out to introduce Colorado Succeeds — warm intro from board member',
        notes: 'Contact provided by Angela R. Focus on scholarship alignment opportunities.'
      },
    ];
    contacts = seeds;
    saveContacts(contacts);
  }

  // ── Initial render ───────────────────────────────────────────
  render();
</script>
</body>
</html>
